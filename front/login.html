<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOCKITU</title>
    <!-- BOOSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Toastify CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./css/login.css">
    
</head>

<body>


    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">STOCKITU</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link logged-out" href="#" data-bs-toggle="modal"
                        data-bs-target="#signinModal">Iniciar sesion</a>
                    <a class="nav-link logged-out" href="#" data-bs-toggle="modal"
                        data-bs-target="#signupModal">Registrarse</a>
                    
                </div>
            </div>
        </div>
    </nav>
    <!-- Navbar -->

    <div class="container p-4">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <ul class="list-group posts">
                </ul>
            </div>
        </div>
    </div>

    <!-- crear cuenta -->
    <div class="modal fade" id="signupModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark">
                <div class="modal-header">
                    <h3>Registrarse</h3>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body p-5">
                    <!--  -->
                    <form id="registerForm">
                        <label for="nombre">Nombre:</label><br>
                        <input type="text" id="nombre" placeholder="ingresa nombre" required><br><br>

                        <label for="apellido">Apellido:</label><br>
                        <input type="text" id="apellido" placeholder="ingresa apellido" required><br><br>

                        <label for="email">Email:</label><br>
                        <input type="email" id="register-email" placeholder="ingresa email" required><br><br>

                        <label for="password">Contraseña:</label><br>
                        <input type="password" id="register-password" placeholder="ingresa password" required><br><br>

                        <input type="submit"  value="Crear usuario" id="submit" class="btn btn-success w-100 mb-4">
                    </form>
                    <!--  -->
                </div>
            </div>
        </div>
    </div>

    <!-- iniciar sesion -->

    <div class="modal fade" id="signinModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalSignin"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark">
                <div class="modal-header">
                    <h3>Iniciar sesion</h3>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <label for="email">Email</label>
                        <input type="text" id="login-email" class="form-control mb-3" placeholder="Title" required>
                        <label for="password">Password:</label>
                        <input type="password" id="login-password" class="form-control mb-3" placeholder="Password" required>
            
                        <button type="submit" class="btn btn-success w-100 mb-4">Login</button>
                      </form>
                </div>
            </div>
        </div>
    </div>

    <div id="intro" class="container mt-4">
        <h1>Bienvenido a STOCKITU ERP</h1>
        <p>registrate o inicia sesion para comenzar.</p>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Toastify js -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <script type="module" src="./js/crearcuenta.js"></script>
    <script type="module" src="./js/iniciarsesion.js"></script>
    <script type="module" src="./js/cerrarsesion.js"></script>
</body>

</html>
